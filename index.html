*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;overflow-x:hidden;position:relative}
.blob{position:fixed;border-radius:50%;z-index:0}
.b1{width:46vmax;height:46vmax;left:-14vmax;bottom:-18vmax;background:var(--blob1);animation:breathe 9s ease-in-out infinite}
.b2{width:38vmax;height:38vmax;right:-12vmax;top:-10vmax;background:var(--blob2);opacity:.6;animation:breathe 11s ease-in-out infinite reverse}

main{position:relative;z-index:2;min-height:100svh;max-width:1400px;margin:0 auto;padding:clamp(20px,4vw,56px);display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,4vw,64px);align-items:center}
.pill{display:inline-block;background:var(--coral);color:#fff;font-weight:800;letter-spacing:.18em;font-size:clamp(13px,1.5vw,20px);padding:.8em 1.6em;border-radius:999px;transform:rotate(-3deg);animation:wobble 3.2s ease-in-out infinite}

.w{display:inline-flex}
.l{display:inline-block;animation:pop .8s cubic-bezier(.3,1.8,.5,1) both,hop 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*.09s),calc(1s + var(--i)*.12s)}
@keyframes pop{from{opacity:0;transform:translateY(60px) scale(.4) rotate(-12deg)}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-.1em) rotate(-3deg)}}
.chips{display:flex;flex-wrap:wrap;gap:16px}
.chip{border-radius:28px;padding:.7em 1.2em;color:#fff;animation:rise .7s cubic-bezier(.2,1.4,.4,1) both}
.chip small{display:block;font-weight:800;letter-spacing:.2em;font-size:clamp(11px,1.1vw,15px)}
.chip b{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:clamp(28px,3.6vw,56px);line-height:1.1}
.c1{background:var(--teal);animation-delay:1.1s}.c2{background:var(--navy);animation-delay:1.3s}.c2 small{color:#FFC93C}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.9)}}
.local{margin-top:28px;animation:rise .7s both;animation-delay:1.5s}
.local small{font-weight:800;letter-spacing:.2em;color:var(--sub);font-size:clamp(11px,1.1vw,15px)}
.local strong{display:block;font-size:clamp(24px,3vw,44px);font-weight:800;margin:4px 0}
.local span{font-weight:600;font-size:clamp(15px,1.6vw,24px)}
.stage{position:relative;justify-self:center;width:min(100%,520px)}
.photo{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 30%;border:10px solid #fff;border-radius:48px;box-shadow:0 30px 60px rgba(0,0,0,.25);animation:float 6s ease-in-out infinite,in 1s both}
@keyframes float{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-14px)}}
@keyframes in{from{opacity:0;scale:.8}}
.balloons{position:absolute;right:-9%;top:-12%;width:44%;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
.balloons .a{animation:bob 4s ease-in-out infinite}.balloons .b{animation:bob 5s ease-in-out -2s infinite}
@keyframes sway{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-4deg)}}
@keyframes bob{50%{transform:translateY(-14px)}}
.cake{position:absolute;left:-12%;bottom:-8%;width:46%;animation:jig 3s ease-in-out infinite}
@keyframes jig{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(3deg) translateY(-10px)}}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick .35s ease-in-out infinite alternate}
.fl:nth-of-type(2){animation-delay:-.12s}.fl:nth-of-type(3){animation-delay:-.22s}
@keyframes flick{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.85,1.2) rotate(4deg)}}
#cf{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#cf i{position:absolute;top:-30px;opacity:.9;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
@media (max-width:820px){main{grid-template-columns:1fr;text-align:left}.stage{order:-1;width:min(86%,380px);margin-top:20px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}#cf{display:none}}
